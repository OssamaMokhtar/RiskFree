name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# RiskLens is a JavaScript prototype (app.js, pages.js) with no npm pipeline.
# This workflow validates that the repo is structurally sound and documents
# the roadmap for a proper npm/TypeScript pipeline.

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Checking required files..."
          test -f README.md && echo "✓ README.md"
          test -f LICENSE && echo "✓ LICENSE"
          test -d docs && echo "✓ docs/ directory"
          test -f SECURITY.md && echo "✓ SECURITY.md"
          test -f PRIVACY.md && echo "✓ PRIVACY.md"
          echo ""
          echo "Checking docs..."
          for f in docs/*.md; do
            test -f "$f" && echo "✓ $f"
          done
          echo ""
          echo "Repository structure validated."

      - name: Check for sensitive data
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "AIza" . --include="*.js" --include="*.md" --include="*.json" 2>/dev/null; then
            echo "⚠ WARNING: Potential Google API key found — review immediately"
            exit 1
          fi
          if grep -r "sk-" . --include="*.js" --include="*.md" --include="*.json" 2>/dev/null; then
            echo "⚠ WARNING: Potential API key found — review immediately"
            exit 1
          fi
          echo "✓ No obvious secrets detected."

      - name: Document roadmap
        run: |
          echo ""
          echo "=== CI Roadmap ==="
          echo "Current: Repository structure validation + secret scanning"
          echo "Next: Add npm/TypeScript pipeline (see improvement plan)"
          echo "Future: npm ci, lint, build, test, npm audit"
          echo ""
          echo "TypeScript migration is on the roadmap — see docs/12-regulatory-positioning.md"
          echo "and the improvement plan at Obsidian/Portfolio-Due-Diligence/03-Improvement-Plan-RiskFree.md"
